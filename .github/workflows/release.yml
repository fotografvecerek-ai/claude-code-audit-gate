name: release

on:
  push:
    tags: ['v*']

jobs:
  zip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: build zip
        run: |
          git archive --format=zip --output="AUDITOR-${GITHUB_REF_NAME}.zip" HEAD \
            START.cmd start.sh NAVOD.txt README.md LICENSE CONTRIBUTING.md CHANGELOG.md docs auditor \
            ':(exclude)auditor/tools/audit.config.json' ':(exclude)auditor/tools/node_modules/**'
      - uses: softprops/action-gh-release@v2
        with:
          files: AUDITOR-v*.zip
          generate_release_notes: true
