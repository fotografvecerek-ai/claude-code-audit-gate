name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  selftest:
    name: selftest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: git identity (selftest vytváří dočasná repa)
        run: |
          git config --global user.email ci@ci
          git config --global user.name ci
      - name: syntax – Node tools and hooks
        shell: bash
        run: |
          set -e
          for f in auditor/tools/*.mjs auditor/kapitan-side/*.mjs auditor/kapitan-side/hygiene/*.mjs; do node --check "$f"; done
          for f in auditor/.claude/hooks/*.js auditor/kapitan-side/*.js auditor/kapitan-side/hygiene/*.js auditor/starter/claude/hooks/*; do node --check "$f"; done
      - name: syntax – bash (bash 3.2 kompatibilita se ověřuje během macOS e2e)
        if: runner.os != 'Windows'
        run: |
          bash -n start.sh
          for f in auditor/*.sh auditor/tools/*.sh auditor/kapitan-side/hygiene/*.sh; do bash -n "$f"; done
          if ! grep -rnE "mapfile|readarray|declare -A|xargs -r|-newermt" --include=*.sh . ; then echo "ok: no bash4isms"; else echo "bash4ism found"; exit 1; fi
      - name: syntax – PowerShell (parser 5.1-kompatibilní, BOM)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errs = $null
          foreach ($f in Get-ChildItem auditor -Filter *.ps1) {
            $bytes = [IO.File]::ReadAllBytes($f.FullName)
            if (-not ($bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF)) { throw "$($f.Name): chybí UTF-8 BOM" }
            [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs) | Out-Null
            if ($errs) { $errs | ForEach-Object { Write-Error $_.Message }; throw "$($f.Name): parse error" }
          }
          Write-Host "ok: ps1 parse + BOM"
      - name: selftest bran (171 scénářů)
        run: node auditor/tools/selftest.mjs

  e2e-install:
    name: e2e install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: selftest
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: git identity
        run: |
          git config --global user.email ci@ci
          git config --global user.name ci
      # Instalátor jen ověřuje, že `claude` existuje, a zapisuje ho do spouštěcích skriptů; v CI se nespouští.
      - name: stub claude CLI – Linux/macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexit 0\n' > "$RUNNER_TEMP/bin/claude" && chmod +x "$RUNNER_TEMP/bin/claude"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: stub claude CLI – Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = Join-Path $env:RUNNER_TEMP 'bin'; New-Item -ItemType Directory -Force $bin | Out-Null
          Set-Content (Join-Path $bin 'claude.cmd') '@exit /b 0' -Encoding ASCII
          Add-Content $env:GITHUB_PATH $bin
      - name: fixture repo (dirty tree + staged file, jako reálný projekt)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/app/src" && cd "$RUNNER_TEMP/app"
          git init -q -b main
          echo '{"name":"app","dependencies":{"next":"15"}}' > package.json
          echo '# projekt' > CLAUDE.md
          echo 'x' > src/a.ts
          printf '@echo off\nvercel --prod\n' > deploy.bat
          git add -A && git commit -qm init
          echo 'rozdelane' >> CLAUDE.md
          echo 'todo' > pozadavky.md && git add pozadavky.md
      - name: install (bash) – Linux/macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          HOME="$RUNNER_TEMP/home" mkdir -p "$RUNNER_TEMP/home/Desktop"
          # záměrně BEZ git identity v tomto HOME: instalátor musí commit zvládnout vlastní identitou a nikdy neskončit "HOTOVO" bez commitu
          HOME="$RUNNER_TEMP/home" bash auditor/install.sh "$RUNNER_TEMP/app" < /dev/null
      - name: install (PowerShell) – Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $repo = Join-Path $env:RUNNER_TEMP 'app'; $ws = Join-Path $env:RUNNER_TEMP 'app-audit'
          powershell -NoProfile -ExecutionPolicy Bypass -File auditor/setup-auditor.ps1 -Repo $repo -Workspace $ws -Yes -Model opus -Kapitan ano -Hygiena ano -CI ne
          if ($LASTEXITCODE -ne 0) { throw "setup failed" }
          powershell -NoProfile -ExecutionPolicy Bypass -File auditor/post-install.ps1 -Repo $repo -Workspace $ws -NoGitHub -NoLaunch
          if ($LASTEXITCODE -ne 0) { throw "post-install failed" }
      - name: aktualizace rozjetého auditu – bez intake, AUDIT/ beze změny
        shell: bash
        run: |
          WS="$RUNNER_TEMP/app-audit"; echo "# intake" > "$WS/AUDIT/00_intake.md"; before=$(cat "$WS/AUDIT/00_intake.md")
          # auditor si upravil nástroje: běžný nástroj musí úpravu přežít, pojistka (bus.mjs) se vrátí na verzi balíku a úprava se zazálohuje
          echo '// mistni uprava auditora' >> "$WS/tools/endpoint-probe.mjs"; echo '// zmena pojistky' >> "$WS/tools/bus.mjs"
          node auditor/tools/update-install.mjs "$RUNNER_TEMP/app" "$WS" | tee "$RUNNER_TEMP/upd.log"
          grep -q "AKTUALIZOVÁNO" "$RUNNER_TEMP/upd.log" && [ "$(cat "$WS/AUDIT/00_intake.md")" = "$before" ]
          grep -q 'mistni uprava auditora' "$WS/tools/endpoint-probe.mjs"
          if grep -q 'zmena pojistky' "$WS/tools/bus.mjs"; then echo "pojistka zůstala upravená"; exit 1; fi
          ls "$WS"/AUDIT/_nastroje-zaloha/*/bus.mjs && grep -q 'NASTROJE-' "$WS/AUDIT/NOVE_CILE.md"
          grep -q 'preflight.mjs' "$WS"/start-auditor.* && grep -q 'preflight.mjs' "$WS"/start-kapitan.*
          grep -q "Tvoje role: Kapitán" "$RUNNER_TEMP/app/CLAUDE.md"
      - name: nový projekt (zdravý start) – založení + vlastní kontrola
        shell: bash
        run: |
          node auditor/tools/new-project.mjs "$RUNNER_TEMP/novy-projekt" --yes --bez-auditora --no-launch --no-shortcut --no-github --no-trust
          cd "$RUNNER_TEMP/novy-projekt"
          test -f CLAUDE.md && test -f .claude/agents/kontrolor.md && test -f .git/hooks/pre-commit
          node .claude/hooks/release-check.mjs && node .claude/hooks/hygiene-all.mjs
      - name: Codex (bez Codex CLI) – pojistky, AGENTS.md, spouštěče
        shell: bash
        run: |
          WS="$RUNNER_TEMP/app-audit"; REPO="$RUNNER_TEMP/app"
          CODEX_HOME="$RUNNER_TEMP/codexhome" node auditor/tools/codex-setup.mjs --ws "$WS" --repo "$REPO" --auditor codex --kapitan codex --yes
          test -f "$WS/.codex/hooks.json" && test -f "$REPO/.codex/hooks.json" && test -f "$REPO/AGENTS.md" && test -f "$WS/AGENTS.md"
          HD=$(node -e "console.log(require(process.argv[1]).hooky)" "$WS/.agents.json"); node "$HD/codex-hooks-check.mjs" "$HD"
          grep -q "codex" "$WS"/start-kapitan.* && grep -q "codex-hooks-check" "$WS"/start-auditor.*
          CODEX_HOME="$RUNNER_TEMP/codexhome" node auditor/tools/codex-setup.mjs --ws "$WS" --repo "$REPO" --auditor claude --kapitan claude --yes
          grep -q -- "--bin" "$WS"/start-kapitan.* && ! grep -q "codex --" "$WS"/start-kapitan.*
      - name: assert – workspace, brána, commit jen instalace, cizí soubory netknuté
        shell: bash
        run: |
          set -e
          WS="$RUNNER_TEMP/app-audit"; REPO="$RUNNER_TEMP/app"
          test -f "$WS/CLAUDE.md" && test -f "$WS/.claude/settings.json" && test -f "$REPO/.claude/hooks/kapitan-audit-guard.js"
          node -e "const s=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));if(!Array.isArray(s.hooks.PreToolUse))throw new Error('auditor hooks not array')" "$WS/.claude/settings.json"
          node -e "const s=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));if(!Array.isArray(s.permissions.additionalDirectories)||!Array.isArray(s.hooks.PreToolUse))throw new Error('kapitan settings not arrays')" "$REPO/.claude/settings.json"
          node "$WS/tools/guard-check.mjs" "$WS" "$REPO"
          cd "$REPO"
          git log --oneline | head -3
          # instalační commit hledáme podle zprávy (na Windows po něm může přijít ještě commit aktualizace pojistek)
          INST=$(git log --format=%H --grep='instalace auditora' -1); test -n "$INST"
          git show --stat --oneline "$INST" | grep -q '.claude/hooks/kapitan-audit-guard.js'
          # žádný commit auditora (instalace ani aktualizace) nesmí obsahovat rozdělané soubory uživatele
          for c in $(git log --format=%H --grep='chore(audit)'); do if git show --name-only --format= "$c" | grep -qxE 'pozadavky.md|CLAUDE.md'; then echo "commit auditora $c obsahuje soubor uživatele"; exit 1; fi; done
          git status --porcelain | grep -q '^A  pozadavky.md'
          git status --porcelain | grep -q '^ M CLAUDE.md'
          if grep -q 'auditor-gate' deploy.bat; then echo "instalátor sáhl do deploy.bat"; exit 1; fi
          if git status --porcelain | grep -q 'settings.local.json'; then echo "místní nastavení počítače není v .gitignore"; exit 1; fi
          grep -q 'Tvoje role: Kapitán' CLAUDE.md && grep -q 'kapitan-role.mjs' .claude/settings.json
          test -f .claude/hooks/auditor-bus.mjs && grep -q 'auditor-bus.mjs' .claude/settings.json
          grep -q 'bus-notify.mjs' .claude/settings.json && grep -q 'bus-notify.mjs' "$WS/.claude/settings.json"
          echo "e2e ok"
